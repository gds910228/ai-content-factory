<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a1a; font-family:'Microsoft YaHei','PingFang SC',sans-serif; display:flex; flex-direction:column; align-items:center; }
  .card { width:1242px; height:1242px; position:relative; overflow:hidden;
          background:linear-gradient(168deg,#081527 0%,#0E2A4E 52%,#0A1C36 100%);
          color:#fff; padding:88px 84px 110px; display:flex; flex-direction:column; }
  .glow1 { position:absolute; width:520px; height:520px; border-radius:50%; top:-180px; right:-140px;
           background:radial-gradient(circle,rgba(53,224,192,0.18) 0%,transparent 70%); }
  .glow2 { position:absolute; width:560px; height:560px; border-radius:50%; bottom:-220px; left:-180px;
           background:radial-gradient(circle,rgba(53,224,192,0.10) 0%,transparent 70%); }
  .top { display:flex; align-items:center; gap:18px; margin-bottom:50px; }
  .dot { width:14px; height:14px; border-radius:50%; background:#35E0C0; box-shadow:0 0 18px #35E0C0; }
  .tag { font-size:32px; letter-spacing:8px; color:#35E0C0; font-weight:700; }
  .topline { flex:1; height:2px; background:linear-gradient(to right,rgba(53,224,192,0.5),transparent); }
  .h-big { font-size:92px; font-weight:900; line-height:1.3; letter-spacing:2px; }
  .cyan { color:#35E0C0; }
  .grid { display:flex; flex-wrap:wrap; gap:20px; margin-top:56px; }
  .ind { width:calc(50% - 10px); background:rgba(255,255,255,0.07); border:1px solid rgba(53,224,192,0.35);
         border-radius:20px; padding:30px 24px; display:flex; align-items:center; justify-content:space-between; }
  .ind .name { font-size:33px; font-weight:800; }
  .ind .badge { font-size:22px; font-weight:700; padding:4px 16px; border-radius:999px; letter-spacing:2px; }
  .badge.old { color:rgba(255,255,255,0.65); border:1px solid rgba(255,255,255,0.35); }
  .badge.new { color:#081527; background:#35E0C0; }
  .quote { margin-top:auto; border-left:6px solid #35E0C0; padding:8px 0 8px 26px; font-size:31px; color:rgba(255,255,255,0.88); line-height:1.7; }
</style>
</head>
<body>
  <div class="card" id="hy">
    <div class="glow1"></div><div class="glow2"></div>
    <div class="top"><span class="dot"></span><span class="tag">提示词包 · 行业扩容</span><span class="topline"></span></div>
    <div class="h-big">首轮出题提示词<br>2个行业 → <span class="cyan">7个行业</span></div>
    <div class="grid">
      <div class="ind"><span class="name">科技</span><span class="badge old">原有</span></div>
      <div class="ind"><span class="name">金融服务</span><span class="badge old">原有</span></div>
      <div class="ind"><span class="name">医学</span><span class="badge new">新增</span></div>
      <div class="ind"><span class="name">法律服务</span><span class="badge new">新增</span></div>
      <div class="ind"><span class="name">新媒体</span><span class="badge new">新增</span></div>
      <div class="ind"><span class="name">政府与公共服务</span><span class="badge new">新增</span></div>
      <div class="ind" style="width:100%;"><span class="name">教育</span><span class="badge new">新增</span></div>
    </div>
    <div class="quote">7个行业提供一级行业版；其他行业拿它做底子，换行业字段、稍微更新就能用。</div>
  </div>
</body>
</html>
