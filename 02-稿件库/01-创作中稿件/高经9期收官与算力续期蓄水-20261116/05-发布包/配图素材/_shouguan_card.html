<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a1a; font-family:'Microsoft YaHei','PingFang SC',sans-serif; display:flex; flex-direction:column; align-items:center; }
  .card { width:1242px; height:1242px; position:relative; overflow:hidden;
          background:linear-gradient(168deg,#081527 0%,#0E2A4E 52%,#0A1C36 100%);
          color:#fff; padding:88px 84px 110px; display:flex; flex-direction:column; }
  .glow1 { position:absolute; width:520px; height:520px; border-radius:50%; top:-180px; right:-140px;
           background:radial-gradient(circle,rgba(53,224,192,0.16) 0%,transparent 70%); }
  .glow2 { position:absolute; width:560px; height:560px; border-radius:50%; bottom:-220px; left:-180px;
           background:radial-gradient(circle,rgba(255,107,107,0.10) 0%,transparent 70%); }
  .top { display:flex; align-items:center; gap:18px; margin-bottom:52px; }
  .dot { width:14px; height:14px; border-radius:50%; background:#FF6B6B; box-shadow:0 0 18px #FF6B6B; }
  .tag { font-size:32px; letter-spacing:8px; color:#FF6B6B; font-weight:700; }
  .topline { flex:1; height:2px; background:linear-gradient(to right,rgba(255,107,107,0.5),transparent); }
  .h-big { font-size:96px; font-weight:900; line-height:1.3; letter-spacing:2px; }
  .cyan { color:#35E0C0; } .red { color:#FF6B6B; }
  .stats { display:flex; gap:24px; margin-top:60px; }
  .stat { flex:1; background:rgba(255,255,255,0.07); border:1px solid rgba(53,224,192,0.35); border-radius:22px; padding:38px 16px; text-align:center; }
  .stat .n { font-size:46px; font-weight:900; color:#35E0C0; }
  .stat .n.hot { color:#FF6B6B; }
  .stat .t { font-size:25px; color:rgba(255,255,255,0.82); margin-top:14px; font-weight:600; line-height:1.5; }
  .quote { margin-top:auto; border-left:6px solid #FF6B6B; padding:8px 0 8px 26px; font-size:31px; color:rgba(255,255,255,0.88); line-height:1.7; }
</style>
</head>
<body>
  <div class="card" id="sg">
    <div class="glow1"></div><div class="glow2"></div>
    <div class="top"><span class="dot"></span><span class="tag">平台通知 · 高经出题</span><span class="topline"></span></div>
    <div class="h-big">9期<span class="cyan">正式收官</span><br>10期<span class="red">时间待定</span></div>
    <div class="stats">
      <div class="stat"><div class="n">11.16</div><div class="t">23:59:59<br>截止收题</div></div>
      <div class="stat"><div class="n hot">权限收回</div><div class="t">未完成题目<br>直接删除</div></div>
      <div class="stat"><div class="n">质检积压</div><div class="t">收题远超预期<br>十期待定</div></div>
    </div>
    <div class="quote">「截止后出题表编辑权限收回，未完成状态的题目将被删除。」——平台通知<br><br>翻译：不是不收了，是吃太饱了，先消化。</div>
  </div>
</body>
</html>
