<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a1a; font-family:'Microsoft YaHei','PingFang SC',sans-serif; display:flex; flex-direction:column; align-items:center; padding:40px 0; }
  .card { width:1242px; height:1656px; position:relative; overflow:hidden;
          background:linear-gradient(168deg,#081527 0%,#0E2A4E 52%,#0A1C36 100%);
          color:#fff; padding:96px 84px 120px; display:flex; flex-direction:column; }
  .glow1 { position:absolute; width:640px; height:640px; border-radius:50%; top:-220px; right:-180px;
           background:radial-gradient(circle,rgba(53,224,192,0.18) 0%,transparent 70%); }
  .glow2 { position:absolute; width:680px; height:680px; border-radius:50%; bottom:-260px; left:-220px;
           background:radial-gradient(circle,rgba(255,107,107,0.12) 0%,transparent 70%); }
  .top { display:flex; align-items:center; gap:18px; margin-bottom:72px; }
  .dot { width:14px; height:14px; border-radius:50%; background:#FF6B6B; box-shadow:0 0 18px #FF6B6B; }
  .tag { font-size:32px; letter-spacing:8px; color:#FF6B6B; font-weight:700; }
  .topline { flex:1; height:2px; background:linear-gradient(to right,rgba(255,107,107,0.5),transparent); }
  .h-big { font-size:110px; font-weight:900; line-height:1.3; letter-spacing:2px; }
  .cyan { color:#35E0C0; } .red { color:#FF6B6B; }
  .stats { display:flex; gap:24px; margin-top:76px; }
  .stat { flex:1; background:rgba(255,255,255,0.07); border:1px solid rgba(53,224,192,0.35); border-radius:22px; padding:44px 20px; text-align:center; }
  .stat .n { font-size:56px; font-weight:900; color:#35E0C0; }
  .stat .n.hot { color:#FF6B6B; }
  .stat .t { font-size:27px; color:rgba(255,255,255,0.8); margin-top:14px; font-weight:600; line-height:1.4; }
  .divider { margin-top:72px; height:1px; background:linear-gradient(to right,transparent,rgba(53,224,192,0.4),transparent); }
  .quote { margin-top:64px; border-left:6px solid #FF6B6B; padding:10px 0 10px 30px; font-size:38px; color:rgba(255,255,255,0.88); line-height:1.75; }
  .brand { margin-top:auto; display:flex; align-items:center; justify-content:space-between; }
  .brand .name { font-size:30px; font-weight:700; letter-spacing:4px; color:rgba(255,255,255,0.85); }
  .brand .vol { background:rgba(53,224,192,0.16); border:1px solid rgba(53,224,192,0.45); color:#35E0C0;
                font-size:24px; font-weight:700; padding:8px 22px; border-radius:999px; letter-spacing:3px; }
</style>
</head>
<body>
  <div class="card" id="w1">
    <div class="glow1"></div><div class="glow2"></div>
    <div class="top"><span class="dot"></span><span class="tag">任务窗口 · 出题任务</span><span class="topline"></span></div>
    <div class="h-big">新一期<span class="cyan">今天开启</span><br>下一期<span class="red">可能暂缓</span></div>
    <div class="stats">
      <div class="stat"><div class="n">5天</div><div class="t">本期窗口<br>11.11 – 11.15</div></div>
      <div class="stat"><div class="n">100+</div><div class="t">上期返修<br>仍在进行中</div></div>
      <div class="stat"><div class="n hot">远超预期</div><div class="t">收题速度<br>目标提前达成</div></div>
    </div>
    <div class="divider"></div>
    <div class="quote">「收题速度远超预期，任务目标提前达成——本期结束后，下一期可能暂缓开放。」<br><br>这可能是最近最好的一班上车窗口。</div>
    <div class="brand"><span class="name">AI启蒙学习</span><span class="vol">XPERT实战 · VOL.04</span></div>
  </div>
</body>
</html>
