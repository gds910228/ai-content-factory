<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a1a; font-family:'Microsoft YaHei','PingFang SC',sans-serif; display:flex; flex-direction:column; align-items:center; padding:40px 0; }
  .card { width:1242px; height:1242px; position:relative; overflow:hidden;
          background:linear-gradient(168deg,#081527 0%,#0E2A4E 52%,#0A1C36 100%);
          color:#fff; padding:88px 84px 110px; display:flex; flex-direction:column; }
  .glow1 { position:absolute; width:520px; height:520px; border-radius:50%; top:-180px; right:-140px;
           background:radial-gradient(circle,rgba(53,224,192,0.16) 0%,transparent 70%); }
  .glow2 { position:absolute; width:560px; height:560px; border-radius:50%; bottom:-220px; left:-180px;
           background:radial-gradient(circle,rgba(255,107,107,0.10) 0%,transparent 70%); }
  .top { display:flex; align-items:center; gap:18px; margin-bottom:56px; }
  .dot { width:14px; height:14px; border-radius:50%; background:#FF6B6B; box-shadow:0 0 18px #FF6B6B; }
  .tag { font-size:32px; letter-spacing:8px; color:#FF6B6B; font-weight:700; }
  .topline { flex:1; height:2px; background:linear-gradient(to right,rgba(255,107,107,0.5),transparent); }
  .h-big { font-size:104px; font-weight:900; line-height:1.28; letter-spacing:2px; }
  .cyan { color:#35E0C0; } .red { color:#FF6B6B; }
  .stats { display:flex; gap:24px; margin-top:64px; }
  .stat { flex:1; background:rgba(255,255,255,0.07); border:1px solid rgba(53,224,192,0.35); border-radius:22px; padding:38px 20px; text-align:center; }
  .stat .n { font-size:52px; font-weight:900; color:#35E0C0; }
  .stat .n.hot { color:#FF6B6B; }
  .stat .t { font-size:27px; color:rgba(255,255,255,0.8); margin-top:12px; font-weight:600; line-height:1.4; }
  .quote { margin-top:auto; border-left:6px solid #FF6B6B; padding:8px 0 8px 26px; font-size:34px; color:rgba(255,255,255,0.85); line-height:1.7; }
</style>
</head>
<body>
  <div class="card" id="n1">
    <div class="glow1"></div><div class="glow2"></div>
    <div class="top"><span class="dot"></span><span class="tag">平台通知 · 高经出题</span><span class="topline"></span></div>
    <div class="h-big">9期<span class="cyan">今天开启</span><br>10期<span class="red">可能暂缓</span></div>
    <div class="stats">
      <div class="stat"><div class="n">5天</div><div class="t">9期窗口<br>11.11 – 11.15</div></div>
      <div class="stat"><div class="n">100+</div><div class="t">8期返修进行中<br>明早10点封版</div></div>
      <div class="stat"><div class="n hot">远超预期</div><div class="t">收题速度<br>目标提前达成</div></div>
    </div>
    <div class="quote">「任务目标提前达成，9期结束后，10期可能暂缓开放，具体时间等群内通知。」——平台官方群通知<br><br>这可能是最近最好的一班上车窗口。</div>
  </div>
</body>
</html>
